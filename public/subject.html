<!DOCTYPE html>
<html>
<head>
    <title>Subjects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
    
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="books.html">Books</a>
        <a href="/admin">Admin</a>
    </div>
</div>


<div class="container center-container" style="margin-top: 50px;">
    <h2 id="title" class="section-title" style="margin-bottom: 30px;"></h2>
    <div id="subjectList" class="modern-grid"></div>
</div>



<script>

const params = new URLSearchParams(window.location.search);
const professional = params.get("professional");

document.getElementById("title").innerText = professional;

// Fetch approved books
fetch("/api/books/approved")
.then(res => res.json())
.then(data => {

    // Get unique subjects under this professional
    const subjects = [...new Set(
        data
        .filter(book => book.professional === professional)
        .map(book => book.subject)
        .filter(Boolean)
    )];

    const subjectList = document.getElementById("subjectList");

    if (subjects.length === 0) {
        subjectList.innerHTML = "<p>No subjects available yet</p>";
        return;
    }

    subjects.forEach(sub => {
        subjectList.innerHTML += `
            <div class="modern-card" onclick="goToBooks('${sub}')">
                <div class="card-icon">📖</div>
                <div class="card-info">
                    <h3>${sub}</h3>
                </div>
                <div class="card-arrow">→</div>
            </div>
        `;
    });

});

function goToBooks(subject) {
    window.location.href =
        `/books.html?professional=${encodeURIComponent(professional)}&subject=${encodeURIComponent(subject)}`;
}

</script>

</body>
</html>
