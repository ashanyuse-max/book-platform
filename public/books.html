<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-body">

<div class="navbar">
    <h2>MBBS Book Platform</h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="books.html">Books</a>
        <a href="/admin">Admin</a>
    </div>
</div>
    

<header class="hero">
    <div class="hero-content">
        <h1 class="hero-title gradient-text" id="heroTitle">Extensive Library</h1>
        <p class="hero-subtitle">Browse, search, and access all your essential medical textbooks instantly.</p>
    </div>
</header>
<div class="hero-spacer"></div>

<div class="professionals-overlay">
    <div class="container center-container" style="max-width: 1200px;">
        <h2 id="title" class="section-title">Available Books</h2>
        <div class="search-container sticky-search" style="width: 100%;">
            <input type="text" id="searchInput" placeholder="Search books by title or author..." onkeyup="searchBooks()">
        </div>
        <div id="bookList" class="books-grid"></div>
    </div>
</div>

<script>
    // PARALLAX SCROLL EFFECT
    window.addEventListener("scroll", () => {
        let scrolled = window.scrollY;
        let hero = document.querySelector(".hero");
        hero.style.transform = `translateY(${scrolled * 0.4}px) scale(${1 - scrolled * 0.0005})`;
        hero.style.opacity = 1 - Math.min(scrolled * 0.0015, 1);
        hero.style.filter = `blur(${scrolled * 0.01}px)`;
    });

const params = new URLSearchParams(window.location.search);
const professional = params.get("professional");
const subject = params.get("subject");

if(subject) {
    document.getElementById("title").innerText = `Books for ${subject}`;
    document.getElementById("heroTitle").innerText = `${subject} Library`;
} else if (professional) {
    document.getElementById("title").innerText = `Books for ${professional}`;
}

let allBooks = [];

fetch("/api/books/approved")
.then(res => res.json())
.then(data => {

    // If professional & subject exist → filter
    if (professional && subject) {
        allBooks = data.filter(book =>
            book.professional === professional &&
            book.subject === subject
        );
    } else {
        // If opened directly, show all books
        allBooks = data;
    }

    displayBooks(allBooks);
});

function displayBooks(books) {
    const bookList = document.getElementById("bookList");
    bookList.innerHTML = "";

    if (books.length === 0) {
        bookList.innerHTML = "<p>No books found.</p>";
        return;
    }

    books.forEach(book => {

        let imageUrl = book.image;
        let imageHtml = '';

        if (!imageUrl || imageUrl.trim() === "") {
            imageHtml = `
                <div class="fallback-cover-compact">
                    <div class="fallback-icon-compact">🏷️</div>
                </div>`;
        } else {
            imageUrl = `/uploads/${imageUrl}`;
            imageHtml = `
                <img src="${imageUrl}" 
                     onerror="this.outerHTML='<div class=\\'fallback-cover-compact\\'><div class=\\'fallback-icon-compact\\'>🏷️</div></div>'" 
                     class="book-img-compact">`;
        }

        bookList.innerHTML += `
            <div class="horizontal-book-card">
                <div class="book-image-compact">
                    ${imageHtml}
                </div>
                
                <div class="book-details-compact">
                    <h3 title="${book.title}">${book.title}</h3>
                    <p class="author">Author: ${book.author}</p>
                    <p class="price">Price: ₹${book.price}</p>
                    
                    <div class="book-meta-compact">
                        <span>${book.professional.split(' ')[0]}</span> • <span>${book.subject || 'General'}</span>
                    </div>
                </div>

                <div class="book-action-compact">
                    <a href="${book.driveLink}" target="_blank" class="download-btn-compact">Get</a>
                </div>
            </div>
        `;
    });
}

function searchBooks() {
    const searchValue = document.getElementById("searchInput").value.toLowerCase();

    const filtered = allBooks.filter(book =>
        book.title.toLowerCase().includes(searchValue) ||
        book.author.toLowerCase().includes(searchValue)
    );

    displayBooks(filtered);
}

</script>

</body>
</html>
