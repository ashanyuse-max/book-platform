<!DOCTYPE html>
<html>
<head>
    <title>Books Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <h2>MBBS Book Platform</h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="books.html">Books</a>
        <a href="/admin">Admin</a>
    </div>
</div>
    

<div class="container center-container" style="margin-top: 50px;">
    <h2 class="section-title">Available Books</h2>
    <div class="search-container" style="width: 100%; margin-bottom: 30px;">
        <input type="text" id="searchInput" placeholder="Search books by title or author..." onkeyup="searchBooks()">
    </div>
    <div id="bookList" class="books-grid"></div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const professional = params.get("professional");
const subject = params.get("subject");

let allBooks = [];

fetch("/api/books/approved")
.then(res => res.json())
.then(data => {

    // If professional & subject exist → filter
    if (professional && subject) {
        allBooks = data.filter(book =>
            book.professional === professional &&
            book.subject === subject
        );
    } else {
        // If opened directly, show all books
        allBooks = data;
    }

    displayBooks(allBooks);
});

function displayBooks(books) {
    const bookList = document.getElementById("bookList");
    bookList.innerHTML = "";

    if (books.length === 0) {
        bookList.innerHTML = "<p>No books found.</p>";
        return;
    }

    books.forEach(book => {

        let imageUrl = book.image;
        let imageHtml = '';

        if (!imageUrl || imageUrl.trim() === "") {
            imageHtml = `
                <div class="fallback-cover">
                    <div class="fallback-icon">🏷️</div>
                    <div>No Cover Available</div>
                </div>`;
        } else {
            imageUrl = `/uploads/${imageUrl}`;
            imageHtml = `
                <img src="${imageUrl}" 
                     onerror="this.outerHTML='<div class=\\'fallback-cover\\'><div class=\\'fallback-icon\\'>🏷️</div><div>No Cover Available</div></div>'" 
                     style="width:100%; height:250px; object-fit:cover; border-radius:12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">`;
        }

        bookList.innerHTML += `
            <div class="book-card">
                ${imageHtml}

                <h3>${book.title}</h3>
                <p>Author: ${book.author}</p>
                <p>₹${book.price}</p>

                <p><strong>Professional:</strong> ${book.professional}</p>
                <p><strong>Subject:</strong> ${book.subject}</p>

                <a href="${book.driveLink}" target="_blank">
                    <button class="btn">Download</button>
                </a>
            </div>
        `;
    });
}

function searchBooks() {
    const searchValue = document.getElementById("searchInput").value.toLowerCase();

    const filtered = allBooks.filter(book =>
        book.title.toLowerCase().includes(searchValue) ||
        book.author.toLowerCase().includes(searchValue)
    );

    displayBooks(filtered);
}

</script>

</body>
</html>
