<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <h2>MBBS Book Platform</h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="books.html">Books</a>
        <a href="/admin">Admin</a>
    </div>
</div>

<div class="container center-container" style="margin-top: 50px;">
    <h2 class="section-title">Admin Panel</h2>
    <div id="bookList" class="books-grid"></div>
</div>

<script>

fetch("/api/books/all")
.then(res => res.json())
.then(data => {
    const bookList = document.getElementById("bookList");
    bookList.innerHTML = "";

    if (data.length === 0) {
        bookList.innerHTML = "<p>No books uploaded yet.</p>";
        return;
    }

    data.forEach(book => {

        let imageUrl = book.image;
        let imageHtml = '';

        if (!imageUrl || imageUrl.trim() === "") {
            imageHtml = `
                <div class="fallback-cover-compact">
                    <div class="fallback-icon-compact">🏷️</div>
                </div>`;
        } else {
            imageUrl = `/uploads/${imageUrl}`;
            imageHtml = `
                <img src="${imageUrl}" 
                     onerror="this.outerHTML='<div class=\\'fallback-cover-compact\\'><div class=\\'fallback-icon-compact\\'>🏷️</div></div>'" 
                     class="book-img-compact">`;
        }

        let subjectSection = "";

        if (!book.subject) {
            subjectSection = `
                <select class="admin-select" onchange="assignSubject('${book._id}', this.value)" style="margin-top: 5px; width: 100%; padding: 4px; font-size:0.8rem;">
                    <option value="">Assign Subject</option>
                    <option>Anatomy</option>
                    <option>Physiology</option>
                    <option>Biochemistry</option>
                    <option>Pathology</option>
                    <option>Pharmacology</option>
                    <option>Microbiology</option>
                    <option>Forensic Medicine</option>
                    <option>Community Medicine</option>
                    <option>ENT</option>
                    <option>Ophthalmology</option>
                    <option>General Medicine</option>
                    <option>General Surgery</option>
                    <option>Obstetrics & Gynaecology</option>
                    <option>Pediatrics</option>
                    <option>Orthopedics</option>
                    <option>Dermatology</option>
                    <option>Psychiatry</option>
                    <option>Radiology</option>
                    <option>Anesthesia</option>
                </select>
            `;
        } else {
            subjectSection = `<p><strong>Subject:</strong> ${book.subject}</p>`;
        }

        let actionButtons = "";

        // Only show approve if pending
        if (!book.isApproved) {
            actionButtons += `
                <button class="download-btn-compact" style="background: linear-gradient(135deg, #10b981, #059669); border:none; width: 100%; cursor: pointer;" onclick="approveBook('${book._id}')">
                    Approve
                </button>
            `;
        }

        // Always show delete
        actionButtons += `
            <button class="download-btn-compact" style="background: linear-gradient(135deg, #ef4444, #dc2626); border:none; width: 100%; cursor: pointer;" onclick="deleteBook('${book._id}')">
                Delete
            </button>
        `;

        bookList.innerHTML += `
            <div class="horizontal-book-card" style="align-items: flex-start;">
                <div class="book-image-compact" style="height: 120px;">
                    ${imageHtml}
                </div>
                
                <div class="book-details-compact">
                    <h3 title="${book.title}">${book.title}</h3>
                    <p class="author">Author: ${book.author}</p>
                    <p class="price">Price: ₹${book.price}</p>
                    
                    <div style="font-size:0.75rem; color:#94a3b8; margin-top:8px; padding-top:8px; border-top:1px dashed rgba(255,255,255,0.1);">
                        <p><strong>Professional:</strong> ${book.professional}</p>
                        ${subjectSection}
                        <p style="margin-top: 4px;"><strong>Status:</strong> ${book.isApproved 
                            ? "<span style='color:#34d399;font-weight:bold;'>Approved</span>" 
                            : "<span style='color:#f59e0b;font-weight:bold;'>Pending</span>"}
                        </p>
                    </div>
                </div>

                <div class="book-action-compact" style="display:flex; flex-direction:column; gap:8px; width: 80px;">
                    ${actionButtons}
                </div>
            </div>
        `;
    });
});


function approveBook(id) {
    fetch(`/api/books/approve/${id}`, { method: "PUT" })
    .then(res => res.json())
    .then(() => location.reload());
}

function deleteBook(id) {
    fetch(`/api/books/delete/${id}`, { method: "DELETE" })
    .then(res => res.json())
    .then(() => location.reload());
}

function assignSubject(id, subject) {

    if (!subject) return;

    fetch(`/api/books/assign-subject/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ subject })
    })
    .then(res => res.json())
    .then(() => {
        alert("Subject Assigned Successfully");
        location.reload();
    });
}

</script>

</body>
</html>
