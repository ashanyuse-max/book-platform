<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <h2>MBBS Book Platform</h2>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="upload.html">Upload</a>
        <a href="books.html">Books</a>
        <a href="/admin">Admin</a>
    </div>
</div>

<div class="container center-container" style="margin-top: 50px;">
    <h2 class="section-title">Admin Panel</h2>
    <div id="bookList" class="books-grid"></div>
</div>

<script>

fetch("/api/books/all")
.then(res => res.json())
.then(data => {
    const bookList = document.getElementById("bookList");
    bookList.innerHTML = "";

    if (data.length === 0) {
        bookList.innerHTML = "<p>No books uploaded yet.</p>";
        return;
    }

    data.forEach(book => {

        let imageUrl = book.image;
        let imageHtml = '';

        if (!imageUrl || imageUrl.trim() === "") {
            imageHtml = `
                <div class="fallback-cover">
                    <div class="fallback-icon">🏷️</div>
                    <div>No Cover Available</div>
                </div>`;
        } else {
            imageUrl = `/uploads/${imageUrl}`;
            imageHtml = `
                <img src="${imageUrl}" 
                     onerror="this.outerHTML='<div class=\\'fallback-cover\\'><div class=\\'fallback-icon\\'>🏷️</div><div>No Cover Available</div></div>'" 
                     style="width:100%; height:250px; object-fit:cover; border-radius:12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">`;
        }

        let subjectSection = "";

        if (!book.subject) {
            subjectSection = `
                <select class="admin-select" onchange="assignSubject('${book._id}', this.value)" style="margin-top: 10px; width: 100%;">
                    <option value="">Assign Subject</option>
                    <option>Anatomy</option>
                    <option>Physiology</option>
                    <option>Biochemistry</option>
                    <option>Pathology</option>
                    <option>Pharmacology</option>
                    <option>Microbiology</option>
                    <option>Forensic Medicine</option>
                    <option>Community Medicine</option>
                    <option>ENT</option>
                    <option>Ophthalmology</option>
                    <option>General Medicine</option>
                    <option>General Surgery</option>
                    <option>Obstetrics & Gynaecology</option>
                    <option>Pediatrics</option>
                    <option>Orthopedics</option>
                    <option>Dermatology</option>
                    <option>Psychiatry</option>
                    <option>Radiology</option>
                    <option>Anesthesia</option>
                </select>
            `;
        } else {
            subjectSection = `<p><strong>Subject:</strong> ${book.subject}</p>`;
        }

        let actionButtons = "";

        // Only show approve if pending
        if (!book.isApproved) {
            actionButtons += `
                <button class="btn" style="background:#10b981; margin-bottom: 10px;" onclick="approveBook('${book._id}')">
                    Approve Book
                </button>
            `;
        }

        // Always show delete
        actionButtons += `
            <button class="btn" style="background:#ef4444;" onclick="deleteBook('${book._id}')">
                Delete Permanently
            </button>
        `;

        bookList.innerHTML += `
            <div class="book-card">
                ${imageHtml}
                <h3>${book.title}</h3>
                <p><strong>Author:</strong> ${book.author}</p>
                <p><strong>Price:</strong> ₹${book.price}</p>
                
                <div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin: 15px 0;">
                    <p><strong>Professional:</strong> ${book.professional}</p>
                    ${subjectSection}
                    <p style="margin-top: 8px;"><strong>Status:</strong> ${book.isApproved 
                        ? "<span style='color:#34d399;font-weight:bold;'>Approved</span>" 
                        : "<span style='color:#f59e0b;font-weight:bold;'>Pending</span>"}
                    </p>
                </div>

                ${actionButtons}
            </div>
        `;
    });
});


function approveBook(id) {
    fetch(`/api/books/approve/${id}`, { method: "PUT" })
    .then(res => res.json())
    .then(() => location.reload());
}

function deleteBook(id) {
    fetch(`/api/books/delete/${id}`, { method: "DELETE" })
    .then(res => res.json())
    .then(() => location.reload());
}

function assignSubject(id, subject) {

    if (!subject) return;

    fetch(`/api/books/assign-subject/${id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ subject })
    })
    .then(res => res.json())
    .then(() => {
        alert("Subject Assigned Successfully");
        location.reload();
    });
}

</script>

</body>
</html>
